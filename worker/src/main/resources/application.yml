spring:
  application:
    name: learning-worker
  datasource:
    url: jdbc:postgresql://localhost:5432/learning
    username: learning
    password: learning
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
